<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD IRON Seller Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#111;color:#eee;font:16px Arial;margin:0;padding:20px}main{max-width:720px;margin:auto}h1{color:#e4a52c}input,textarea,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;background:#222;color:white;border:1px solid #777;border-radius:7px}button{background:#e4a52c;color:#111;font-weight:bold;cursor:pointer}section{padding:18px;border:1px solid #555;border-radius:12px;margin:15px 0}.muted{color:#bbb}a{color:#e4a52c}</style><main><a href="/">← ROAD IRON</a><h1>Seller Portal</h1><p>Independent sellers can request approval and submit listings for review. Listings are not published automatically. Payments and seller payouts are not yet enabled.</p><section id="login"><h2>Sign in</h2><input id="email" type="email" placeholder="Your email"><button onclick="login()">Email me a sign-in link</button></section><section id="portal" hidden><button onclick="logout()">Sign out</button><p id="state"></p><div id="apply"><h2>Seller application</h2><input id="display" placeholder="Seller or business name"><label><input type="checkbox" id="terms" style="width:auto"> I agree to seller responsibilities: accurate listings, legal ownership, defect disclosures, no recalled or unsafe items, fulfillment obligations, and indemnity to the extent permitted by law. A final agreement is required before live selling.</label><button onclick="apply()">Request seller approval</button></div><div id="submit" hidden><h2>Submit item for review</h2><input id="title" placeholder="Item title"><select id="category"><option>NOS Parts</option><option>Used Parts</option><option>Vintage Clothing</option><option>Classic Cars</option></select><textarea id="description" placeholder="Description, defects and fitment"></textarea><input id="condition" placeholder="Condition"><input id="price" type="number" min=".01" step=".01" placeholder="Price in USD"><textarea id="shipping" placeholder="Shipping details, weight, dimensions and origin ZIP"></textarea><button onclick="submitItem()">Send listing for review</button></div><h2>My submissions</h2><div id="items"></div></section><p id="message" role="status"></p></main><script>const sb=supabase.createClient('https://sblnblmcvyvmllyvrnbb.supabase.co','sb_publishable_eV80ZW_U97yqGquu4bFL0A_i4S0hCia');let user=null,profile=null;const $=id=>document.getElementById(id);function msg(t){$('message').textContent=t}async function login(){let e=$('email').value.trim();if(!e)return msg('Enter email');const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:'https://road-iron.com/seller.html'}});msg(error?.message||'Check your email for a sign-in link.')}async function logout(){await sb.auth.signOut();location.reload()}async function refresh(){const{data}=await sb.auth.getUser();user=data.user;$('login').hidden=!!user;$('portal').hidden=!user;if(!user)return;const p=await sb.from('marketplace_sellers').select('*').eq('user_id',user.id).maybeSingle();profile=p.data;$('apply').hidden=!!profile;$('submit').hidden=profile?.status!=='approved';$('state').textContent=profile?'Seller status: '+profile.status:'Apply to become a seller.';const s=await sb.from('seller_submissions').select('title,status,price,created_at').eq('seller_id',user.id).order('created_at',{ascending:false});$('items').textContent=s.error?s.error.message:(s.data?.map(x=>x.title+' — $'+x.price+' — '+x.status).join(' | ')||'No submissions yet.')}async function apply(){if(!$('terms').checked)return msg('Accept seller responsibilities first.');const display_name=$('display').value.trim();if(!display_name)return msg('Enter your seller name.');const{error}=await sb.from('marketplace_sellers').insert({user_id:user.id,display_name});msg(error?.message||'Application received. Approval is required before submitting listings.');if(!error)refresh()}async function submitItem(){const item={seller_id:user.id,title:$('title').value.trim(),category:$('category').value,description:$('description').value,condition:$('condition').value,price:Number($('price').value),shipping_notes:$('shipping').value};if(!item.title||!item.description||item.price<=0)return msg('Enter a title, description and price.');const{error}=await sb.from('seller_submissions').insert(item);msg(error?.message||'Listing submitted for review. It is not public.');if(!error)refresh()}sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></html>
