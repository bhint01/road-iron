<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ROAD IRON Advertising Admin</title><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><style>body{margin:0;background:#101112;color:#eee;font-family:Arial}.wrap{max-width:900px;margin:auto;padding:25px}.card{background:#191b1d;border:1px solid #34383b;border-radius:12px;padding:20px;margin:15px 0}input,select,textarea{width:100%;box-sizing:border-box;background:#111315;color:#eee;border:1px solid #444;border-radius:7px;padding:11px;margin:5px 0 12px}button{background:#e0a12b;border:0;padding:11px 14px;border-radius:7px;font-weight:bold;margin:3px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border-top:1px solid #34383b;padding:14px 0}.muted{color:#aaa}.stats{margin:7px 0;font-weight:bold}.hidden{display:none}a{color:#e0a12b}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class='wrap'><h1>ROAD IRON — Advertising</h1><p><a href='admin.html'>← Inventory Admin</a> · <a href='advertising.html'>Public Advertising Page</a></p><div id='login' class='card'><h2>Owner Login</h2><input id='email' type='email' placeholder='Owner email'><button onclick='login()'>Send Login Link</button><p id='loginmsg'></p></div><div id='app' class='hidden'><div class='card'><h2>Create / Edit Advertisement</h2><form id='adform'><input id='business_name' placeholder='Business name' required><input id='headline' placeholder='Headline' required><textarea id='description' rows='3' placeholder='Description'></textarea><input id='image_url' type='url' placeholder='Image URL (optional)'><input id='destination_url' type='url' placeholder='Advertiser website URL (optional)'><div class='row'><select id='placement'><option value='homepage'>Homepage / Sponsored</option><option value='inventory'>Inventory / Banner</option><option value='featured_business'>Featured Business / Sponsor</option></select><select id='status'><option value='draft'>Draft</option><option value='active'>Active</option><option value='paused'>Paused</option><option value='expired'>Expired</option></select></div><div class='row'><div><label>Start date</label><input id='start_date' type='date'></div><div><label>End date</label><input id='end_date' type='date'></div></div><label>Monthly price charged ($)</label><input id='monthly_price' type='number' min='0' step='.01'><button>Save Advertisement</button><button type='button' onclick='resetForm()'>Clear</button><p id='msg'></p></form></div><div class='card'><h2>Advertisements & Performance</h2><p class='muted'>Public ads rotate automatically. Impressions count displays; clicks count advertiser-link visits.</p><div id='ads'></div></div><div class='card'><h2>Advertising Inquiries</h2><div id='inquiries'></div></div></div></div><script>const sb=supabase.createClient('https://sblnblmcvyvmllyvrnbb.supabase.co','sb_publishable_eV80ZW_U97yqGquu4bFL0A_i4S0hCia'),$=id=>document.getElementById(id);let editId=null,rows=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function check(){const{data}=await sb.auth.getSession();$('login').classList.toggle('hidden',!!data.session);$('app').classList.toggle('hidden',!data.session);if(data.session)load()}async function login(){const{error}=await sb.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:'https://road-iron.com/advertising-admin.html'}});$('loginmsg').textContent=error?error.message:'Login email sent.'}async function load(){let r=await sb.from('advertisements').select('*').order('created_at',{ascending:false});rows=r.data||[];let ev=await sb.from('ad_events').select('advertisement_id,event_type');const stats={};for(const x of(ev.data||[])){stats[x.advertisement_id]??={impression:0,click:0};stats[x.advertisement_id][x.event_type]++}$('ads').innerHTML=rows.map(a=>{const s=stats[a.id]||{impression:0,click:0},ctr=s.impression?((s.click/s.impression)*100).toFixed(1):'0.0';return `<div class='item'><b>${esc(a.business_name)} — ${esc(a.headline)}</b><br><span class='muted'>${esc(a.placement)} • ${esc(a.status)}${a.monthly_price!=null?' • $'+Number(a.monthly_price).toFixed(2)+'/mo':''}${a.start_date?' • '+a.start_date:''}${a.end_date?' to '+a.end_date:''}</span><div class='stats'>${s.impression} impressions • ${s.click} clicks • ${ctr}% click rate</div><button onclick="editAd('${a.id}')">Edit</button><button onclick="changeStatus('${a.id}','${a.status==='active'?'paused':'active'}')">${a.status==='active'?'Pause':'Activate'}</button></div>`}).join('')||'<p>No advertisements yet.</p>';let q=await sb.from('advertiser_inquiries').select('*').order('created_at',{ascending:false}).limit(100);$('inquiries').innerHTML=(q.data||[]).map(x=>`<div class='item'><b>${esc(x.business_name)}</b> — ${esc(x.package)}<br><span class='muted'>${esc(x.contact_name)} • ${esc(x.email)} • ${esc(x.phone)}</span><p>${esc(x.message)}</p></div>`).join('')||'<p>No inquiries yet.</p>'}function editAd(id){const a=rows.find(x=>x.id===id);if(!a)return;editId=id;['business_name','headline','description','image_url','destination_url','placement','status','start_date','end_date','monthly_price'].forEach(k=>$(k).value=a[k]??'');scrollTo({top:0,behavior:'smooth'})}function resetForm(){editId=null;$('adform').reset()}async function changeStatus(id,status){const{error}=await sb.from('advertisements').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}$('adform').addEventListener('submit',async e=>{e.preventDefault();const p={business_name:business_name.value,headline:headline.value,description:description.value||null,image_url:image_url.value||null,destination_url:destination_url.value||null,placement:placement.value,status:status.value,start_date:start_date.value||null,end_date:end_date.value||null,monthly_price:monthly_price.value?+monthly_price.value:null,updated_at:new Date().toISOString()};if(p.start_date&&p.end_date&&p.end_date<p.start_date){$('msg').textContent='End date must be after start date.';return}const r=editId?await sb.from('advertisements').update(p).eq('id',editId):await sb.from('advertisements').insert(p);$('msg').textContent=r.error?r.error.message:'Saved.';if(!r.error){resetForm();load()}});sb.auth.onAuthStateChange(()=>setTimeout(check,0));check();</script></body></html>
