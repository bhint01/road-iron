<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller dashboard | Road Iron Auctions</title><style>body{font:16px system-ui;background:#121b24;color:#f4f4f4;max-width:720px;margin:30px auto;padding:20px}label{display:block;margin:14px 0}input,textarea,button{font:inherit;padding:10px;width:100%;box-sizing:border-box}button{background:#c94e2d;color:white;border:0;margin-top:16px}a{color:#f8b18f}.note{color:#f1c384}</style></head><body><nav aria-label="Auction navigation"><a href="index.html">← Auctions</a> · <a href="account.html">My bids &amp; results</a> · <a href="watchlist.html">Watchlist</a></nav><h1>Seller dashboard</h1><h2>Create an auction draft</h2><p class="note" id="status">Backend setup required before saving.</p><form id="form"><label>Item title<input name="title" required minlength="3" maxlength="160"></label><label>Description<textarea name="description" rows="5"></textarea></label><label>Image URL (HTTPS)<input name="image_url" type="url" placeholder="https://"></label><label>Opening bid (USD)<input name="opening" type="number" min="1" step=".01" required></label><label>Minimum increment (USD)<input name="increment" type="number" min=".01" step=".01" value="1" required></label><label>Reserve (USD, optional)<input name="reserve" type="number" min="0" step=".01"></label><label>Start date/time<input name="starts" type="datetime-local" required></label><label>End date/time<input name="ends" type="datetime-local" required></label><button type="submit">Save draft</button></form><h2>My auctions</h2><p id="draftstatus">Sign in to view your drafts.</p><div id="drafts"></div><script type="module">
import { db } from './supabase-client.js';
const status=document.querySelector('#status'),form=document.querySelector('#form');
if(db){status.textContent=db.previewOnly?'Preview only. Draft creation is disabled.':'Sign in from the auction homepage before saving a draft.';if(db.previewOnly)form.querySelectorAll('input,textarea,button').forEach(input=>input.disabled=true);loadDrafts();}
async function loadDrafts(){const holder=document.querySelector('#drafts'),msg=document.querySelector('#draftstatus');holder.replaceChildren();const {data:{user}}=await db.auth.getUser();if(!user){msg.textContent='Sign in on the homepage first.';return;}const {data,error}=await db.from('auctions').select('id,title,status,starts_at,ends_at').eq('seller_id',user.id).order('created_at',{ascending:false});if(error){msg.textContent=error.message;return;}msg.textContent=(data||[]).length+' auction(s)';for(const a of data||[]){const item=document.createElement('p');item.textContent=a.title+' — '+a.status+' — ends '+new Date(a.ends_at).toLocaleString();holder.append(item);}}
form.onsubmit=async e=>{e.preventDefault();if(!db){status.textContent='Backend not configured; draft was not saved.';return;}const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){status.textContent='Sign in first.';return;}
const f=new FormData(form),cents=x=>Math.round(Number(x)*100),starts=new Date(f.get('starts')),ends=new Date(f.get('ends'));
if(!Number.isFinite(starts.getTime())||!Number.isFinite(ends.getTime())||ends<=starts){status.textContent='End time must be later than start time.';return;}
const url=String(f.get('image_url')||'');if(url&&!url.startsWith('https://')){status.textContent='Image must use HTTPS.';return;}
const payload={seller_id:user.id,title:String(f.get('title')).trim(),description:String(f.get('description')||''),image_url:url||null,opening_bid_cents:cents(f.get('opening')),increment_cents:cents(f.get('increment')),reserve_cents:f.get('reserve')===''?null:cents(f.get('reserve')),starts_at:starts.toISOString(),ends_at:ends.toISOString(),status:'draft'};
const {error}=await db.from('auctions').insert(payload);status.textContent=error?'Save failed: '+error.message:'Draft saved. An auction administrator must review and schedule it before publication.';if(!error){form.reset();await loadDrafts();}};
</script></body></html>
