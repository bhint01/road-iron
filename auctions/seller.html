<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller dashboard | Road Iron Auctions</title><style>body{font:16px system-ui;background:#121b24;color:#f4f4f4;max-width:720px;margin:30px auto;padding:20px}label{display:block;margin:14px 0}input,textarea,button{font:inherit;padding:10px;width:100%;box-sizing:border-box}button{background:#c94e2d;color:white;border:0;margin-top:16px}a{color:#f8b18f}.note{color:#f1c384}</style></head><body><nav aria-label="Auction navigation"><a href="index.html">← Auctions</a> · <a href="account.html">My bids &amp; results</a> · <a href="watchlist.html">Watchlist</a></nav><h1>Seller dashboard</h1><h2 id="draft-heading">Create an auction draft</h2><form id="form"><label>Item title<input name="title" required minlength="3" maxlength="160"></label><label>Description<textarea name="description" rows="5"></textarea></label><label>Listing photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p>Choose a photo from your gallery. One JPG, PNG or WebP, up to 20 MB. Listing photos are public once uploaded; avoid personal information.</p><img id="photo-preview" alt="Selected listing photo" hidden style="max-width:100%;max-height:280px"><p id="photo-status" role="status"></p><label>Opening bid (USD)<input name="opening" type="number" min="1" step=".01" required></label><label>Minimum increment (USD)<input name="increment" type="number" min=".01" step=".01" value="1" required></label><label>Reserve (USD, optional)<input name="reserve" type="number" min="0" step=".01"></label><label>Start date/time<input name="starts" type="datetime-local" required></label><label>End date/time<input name="ends" type="datetime-local" required></label><button type="submit">Save draft</button><button id="cancel-edit" type="button" hidden>Cancel editing</button><p class="note" id="status" role="status" aria-live="polite" tabindex="-1">Checking sign-in…</p></form><h2>My auctions</h2><p id="draftstatus">Sign in to view your drafts.</p><div id="drafts"></div><script type="module">
import { db } from './supabase-client.js';
import { preparePhoto, uploadPhoto } from './seller-photos.js';
const status=document.querySelector('#status'),form=document.querySelector('#form');
const photo=document.querySelector('#photo'),preview=document.querySelector('#photo-preview'),photoStatus=document.querySelector('#photo-status');
const heading=document.querySelector('#draft-heading'),cancel=document.querySelector('#cancel-edit'),saveButton=form.querySelector('button[type="submit"]');
let selectedPhoto=null,previewUrl=null,photoGeneration=0,photoBusy=false,saving=false,editing=null,loadingDraft=false,editGeneration=0,listGeneration=0,dirty=false;
const localDate=value=>{const date=new Date(value);return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);};
function clearPhoto(){
 photoGeneration++;selectedPhoto=null;photoBusy=false;photo.value='';preview.hidden=true;photoStatus.textContent='';
 if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null;}
}
function resetEditor(){
 editGeneration++;loadingDraft=false;editing=null;form.reset();clearPhoto();dirty=false;
 heading.textContent='Create an auction draft';cancel.hidden=true;saveButton.textContent='Save draft';saveButton.disabled=Boolean(db?.previewOnly);
}
form.addEventListener('input',()=>{dirty=true;});
photo.onchange=async()=>{
 const generation=++photoGeneration;selectedPhoto=null;preview.hidden=true;dirty=true;
 if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null;}
 const file=photo.files[0];if(!file){photoBusy=false;photoStatus.textContent='';if(editing?.image_url){preview.src=editing.image_url;preview.hidden=false;}return;}
 photoBusy=true;photoStatus.textContent='Preparing photo…';
 try{const blob=await preparePhoto(file);if(generation!==photoGeneration)return;selectedPhoto=blob;previewUrl=URL.createObjectURL(blob);preview.src=previewUrl;preview.hidden=false;photoStatus.textContent='Photo ready. Save draft to upload it.';}
 catch(error){if(generation===photoGeneration)photoStatus.textContent=error.message;}
 finally{if(generation===photoGeneration)photoBusy=false;}
};
async function editDraft(id){
 if(saving||loadingDraft||db.previewOnly)return;
 if(dirty&&!confirm('Discard your unsaved changes and open this draft?'))return;
 const generation=++editGeneration;loadingDraft=true;saveButton.disabled=true;status.textContent='Opening draft…';
 try{
  const {data,error}=await db.rpc('my_auction_draft',{p_auction_id:id});
  if(generation!==editGeneration)return;
  if(error)throw error;
  const draft=data?.[0];if(!draft)throw new Error('This draft is unavailable. Refresh your auction list.');
  clearPhoto();editing=draft;
  const values={title:draft.title,description:draft.description||'',opening:Number(draft.opening_bid_cents)/100,increment:Number(draft.increment_cents)/100,reserve:draft.reserve_cents===null?'':Number(draft.reserve_cents)/100,starts:localDate(draft.starts_at),ends:localDate(draft.ends_at)};
  for(const [name,value] of Object.entries(values))form.elements.namedItem(name).value=String(value);
  if(draft.image_url&&draft.image_url.startsWith('https://')){preview.src=draft.image_url;preview.hidden=false;photoStatus.textContent='Saved photo. Choose another photo to replace it.';}
  heading.textContent='Edit auction draft';saveButton.textContent='Save changes';cancel.hidden=false;dirty=false;
  status.textContent='Draft opened. Your changes stay private until an administrator publishes the auction.';
  heading.scrollIntoView({behavior:'smooth',block:'start'});form.elements.namedItem('title').focus({preventScroll:true});
 }catch(error){if(generation===editGeneration)status.textContent='Could not open draft: '+error.message;}
 finally{if(generation===editGeneration){loadingDraft=false;saveButton.disabled=false;}}
}
cancel.onclick=()=>{if(saving)return;if(dirty&&!confirm('Discard your unsaved changes?'))return;resetEditor();status.textContent='Editing cancelled. Your saved draft has not changed.';};
async function loadDrafts(showSignInStatus=false){
 const current=++listGeneration,holder=document.querySelector('#drafts'),msg=document.querySelector('#draftstatus');holder.replaceChildren();
 try{
  const {data:{user},error:authError}=await db.auth.getUser();if(current!==listGeneration)return;
  if(authError)throw authError;
  if(!user){msg.textContent='Sign in on the homepage first.';if(showSignInStatus)status.textContent='Sign in on the auction homepage to create or edit drafts.';return;}
  if(showSignInStatus&&!db.previewOnly)status.textContent='Signed in. Create a draft or choose Edit draft below.';
  const {data,error}=await db.from('auctions').select('id,title,status,starts_at,ends_at').eq('seller_id',user.id).order('created_at',{ascending:false});
  if(current!==listGeneration)return;if(error)throw error;
  msg.textContent=(data||[]).length+' auction(s)';
  for(const a of data||[]){
   const item=document.createElement('article'),label=document.createElement('p');label.textContent=a.title+' — '+a.status+' — ends '+new Date(a.ends_at).toLocaleString();item.append(label);
   if(a.status==='draft'){const edit=document.createElement('button');edit.type='button';edit.textContent='Edit draft';edit.disabled=Boolean(db.previewOnly);edit.setAttribute('aria-label','Edit draft: '+a.title);edit.onclick=()=>editDraft(a.id);item.append(edit);}
   holder.append(item);
  }
 }catch(error){if(current===listGeneration){msg.textContent='Could not load your auctions: '+error.message;if(showSignInStatus)status.textContent='Could not check your sign-in: '+error.message;}}
}
if(db){
 if(db.previewOnly){status.textContent='Preview only. Draft changes are disabled.';form.querySelectorAll('input,textarea,button').forEach(input=>input.disabled=true);}
 loadDrafts(true);
 db.auth.onAuthStateChange?.((event)=>{if(event==='SIGNED_OUT'){listGeneration++;resetEditor();document.querySelector('#drafts').replaceChildren();document.querySelector('#draftstatus').textContent='Sign in on the homepage first.';status.textContent='You are signed out.';}});
}
form.noValidate=true;
form.onsubmit=async e=>{
 e.preventDefault();if(saving||loadingDraft||db?.previewOnly)return;
 if(!form.checkValidity()){
  const invalid=form.querySelector(':invalid');
  const label=invalid?.closest('label')?.textContent.trim()||'Required field';
  status.textContent=label+': '+(invalid?.validationMessage||'Please check this field.');invalid?.focus();form.reportValidity();return;
 }
 if(photoBusy){status.textContent='Wait for your photo to finish preparing.';return;}
 if(photo.files.length&&!selectedPhoto){status.textContent='Choose a supported photo before saving.';return;}
 if(!db){status.textContent='Backend not configured; draft was not saved.';return;}
 saving=true;saveButton.disabled=true;saveButton.textContent='Saving…';photo.disabled=true;cancel.disabled=true;let uploaded=null,committed=false;
 try{
  status.textContent='Checking sign-in…';
  const {data:{user},error:authError}=await db.auth.getUser();
  if(authError||!user)throw new Error('Please sign in on the auction homepage, then return to save your draft');
  if(editing&&editing.seller_id!==user.id)throw new Error('Sign in with the account that owns this draft');
  const f=new FormData(form),cents=x=>Math.round(Number(x)*100),starts=new Date(f.get('starts')),ends=new Date(f.get('ends'));
  if(!Number.isFinite(starts.getTime())||!Number.isFinite(ends.getTime())||ends<=starts)throw new Error('End time must be later than start time');
  const payload={seller_id:user.id,title:String(f.get('title')).trim(),description:String(f.get('description')||''),image_url:editing?.image_url||null,opening_bid_cents:cents(f.get('opening')),increment_cents:cents(f.get('increment')),reserve_cents:f.get('reserve')===''?null:cents(f.get('reserve')),starts_at:starts.toISOString(),ends_at:ends.toISOString(),status:'draft'};
  status.textContent=selectedPhoto?'Uploading photo…':'Saving draft…';
  if(selectedPhoto){uploaded=await uploadPhoto(db,user.id,selectedPhoto);payload.image_url=uploaded.url;}
  const wasEditing=Boolean(editing);
  if(editing){
   const {seller_id,status:auctionStatus,...changes}=payload;
   const {data,error}=await db.from('auctions').update(changes).eq('id',editing.id).eq('seller_id',user.id).eq('status','draft').eq('updated_at',editing.updated_at).select('id');
   if(error)throw error;if(data?.length!==1)throw new Error('This draft changed or was published. Reopen it before saving again');
  }else{const {error}=await db.from('auctions').insert(payload);if(error)throw error;}
  committed=true;resetEditor();status.textContent=wasEditing?'Changes saved to your draft. It is still awaiting administrator review.':'Draft saved. An auction administrator must review and schedule it before publication.';
  await loadDrafts();
 }catch(error){
  if(uploaded&&!committed){try{await db.storage.from('auction-photos').remove([uploaded.path]);}catch{}}
  status.textContent='Save failed: '+error.message+'. Your form is still here; please retry.';
 }finally{saving=false;saveButton.disabled=Boolean(db.previewOnly);saveButton.textContent=editing?'Save changes':'Save draft';photo.disabled=Boolean(db.previewOnly);cancel.disabled=false;}
};
</script></body></html>
