<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Road Iron Admin</title><script src='https://unpkg.com/@supabase/supabase-js@2.57.4/dist/umd/supabase.js'></script><style>body{font-family:Arial;background:#101112;color:#eee;margin:0}.wrap{max-width:850px;margin:auto;padding:25px}input,select,textarea{width:100%;box-sizing:border-box;background:#1d2022;color:#eee;border:1px solid #444;border-radius:7px;padding:11px;margin:5px 0 12px}button{background:#e0a12b;border:0;padding:12px 16px;border-radius:7px;font-weight:bold}.card{background:#191b1d;border:1px solid #34383b;border-radius:12px;padding:20px;margin:15px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#222528;padding:15px;border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:#aaa}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class='wrap'><h1>ROAD IRON — Admin</h1><p class='muted'>Inventory, shipping and orders.</p><div id='login' class='card'><h2>Owner Login</h2><input id='email' type='email' placeholder='Your email'><button id='loginBtn'>Send Login Link</button><p id='msg'></p></div><div id='app' class='hidden'><div class='card'><button onclick='logout()'>Log Out</button><h2 id='formTitle'>Add a Part</h2><form id='form'><label>Part name</label><input id='name' required><div class='row'><div><label>Category</label><select id='category'><option>NOS Parts</option><option>Used Parts</option><option>Vintage Clothing</option><option>Classic Cars</option></select></div><div><label>Price</label><input id='price' type='number' min='0' step='.01' required></div></div><div class='row'><div><label>Year</label><input id='year'></div><div><label>Make</label><input id='make'></div></div><div class='row'><div><label>Model</label><input id='model'></div><div><label>Part number</label><input id='part_number'></div></div><div class='row'><div><label>Condition</label><input id='condition'></div><div><label>Quantity</label><input id='quantity' type='number' min='0' value='1'></div></div><label>Description</label><textarea id='description' rows='5'></textarea><div class='row'><div><label>Shipping</label><select id='shipping_type'><option value='calculated'>Calculated shipping</option><option value='free'>Free shipping</option><option value='local_pickup'>Local pickup only</option><option value='freight_quote'>Freight quote required</option></select></div><div><label>Ship-from ZIP</label><input id='ship_from_postal_code' inputmode='numeric' maxlength='10' placeholder='Required for calculated shipping'></div></div><div class='row'><div><label>Packed weight (lb)</label><input id='weight_lbs' type='number' min='0' step='.01'></div><div><label>Packed length (in)</label><input id='length_in' type='number' min='0' step='.01'></div></div><div class='row'><div><label>Packed width (in)</label><input id='width_in' type='number' min='0' step='.01'></div><div><label>Packed height (in)</label><input id='height_in' type='number' min='0' step='.01'></div></div><label>Photos</label><input id='photos' type='file' accept='image/*' multiple><button id='publishBtn' type='submit'>Save Listing</button> <button id='cancelEdit' type='button' class='hidden' onclick='cancelEditing()'>Cancel Edit</button><p id='status' class='muted'></p></form></div><div class='card'><h2>Your Listings</h2><div id='list'></div></div><div class='card'><h2>Orders</h2><div id='orders'></div></div></div></div><script>const U='https://sblnblmcvyvmllyvrnbb.supabase.co',K='sb_publishable_eV80ZW_U97yqGquu4bFL0A_i4S0hCia',sb=supabase.createClient(U,K),$=id=>document.getElementById(id);let editingId=null,inventory=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function check(){const{data}=await sb.auth.getSession();$('login').classList.toggle('hidden',!!data.session);$('app').classList.toggle('hidden',!data.session);if(data.session)load()}async function login(){const email=$('email').value.trim();if(!email)return;$('msg').textContent='Sending...';const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://road-iron.com/admin.html'}});$('msg').textContent=error?error.message:'Login email sent.'}async function logout(){await sb.auth.signOut();check()}async function load(){const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});inventory=data||[];$('list').innerHTML=error?esc(error.message):inventory.map(p=>`<div class='item' data-listing-id='${p.id}'><div><b>${esc(p.name)}</b><br><span class='muted'>${esc(p.category)} • $${Number(p.price).toFixed(2)} • ${esc(p.status)} • ${esc(p.shipping_type||'')}</span></div><div><button onclick="editItem('${p.id}')">Edit</button> <button onclick="setStatus('${p.id}','${p.status==='active'?'draft':'active'}')">${p.status==='active'?'Hide':'Activate'}</button> <button onclick="setStatus('${p.id}','sold')">Sold</button> <button onclick="deleteListing('${p.id}')" style="background:#963c35;color:white">Delete</button></div></div>`).join('')||'<p>No listings.</p>';loadOrders()}async function loadOrders(){const{data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(50);$('orders').innerHTML=error?esc(error.message):(data||[]).map(o=>`<div class='item'><div><b>Order #${o.order_number||''}</b><br><span class='muted'>${esc(o.customer_name||o.customer_email||'Customer')} • $${Number(o.total||0).toFixed(2)} • Payment: ${esc(o.status)} • Fulfillment: ${esc(o.fulfillment_status||'unfulfilled')}</span>${o.tracking_code?`<br><span class='muted'>Tracking: ${esc(o.tracking_code)}</span>`:''}</div></div>`).join('')||'<p class="muted">No orders yet.</p>'}async function deleteListing(id){const p=inventory.find(x=>x.id===id);if(!p)return;const ok=confirm('Permanently delete "'+p.name+'"? This cannot be undone. This will NOT mark the item sold.');if(!ok)return;const{data:photos,error:photoError}=await sb.from('product_photos').select('storage_path').eq('product_id',id);if(photoError){alert('Could not check photos: '+photoError.message);return}const{error:unlinkError}=await sb.from('product_photos').delete().eq('product_id',id);if(unlinkError){alert('Could not delete photo records: '+unlinkError.message);return}const{error}=await sb.from('products').delete().eq('id',id);if(error){alert('Could not delete listing: '+error.message);return}if(photos?.length){const paths=photos.map(x=>x.storage_path).filter(Boolean);if(paths.length){const{error:storageError}=await sb.storage.from('product-images').remove(paths);if(storageError)alert('Listing deleted, but some photo files may remain: '+storageError.message)}}inventory=inventory.filter(x=>x.id!==id);const list=$('list');if(list){const card=list.querySelector(`[data-listing-id="${id}"]`);if(card)card.remove();}if(editingId===id)cancelEditing();await load();alert('Listing deleted. It was not marked sold.')} async function setStatus(id,status){const p=inventory.find(x=>x.id===id);if(status==='active'&&p?.shipping_type==='calculated'&&(!p.ship_from_postal_code||!+p.weight_lbs||!+p.length_in||!+p.width_in||!+p.height_in)){alert('Add ship-from ZIP and packed weight/dimensions before activating this listing.');editItem(id);return}const{error}=await sb.from('products').update({status}).eq('id',id);if(error)alert(error.message);else load()}function editItem(id){const p=inventory.find(x=>x.id===id);if(!p)return;editingId=id;['name','category','price','year','make','model','part_number','condition','quantity','description','shipping_type','ship_from_postal_code','weight_lbs','length_in','width_in','height_in'].forEach(k=>$(k).value=p[k]??'');$('formTitle').textContent='Edit Listing';$('publishBtn').textContent='Save Changes';$('cancelEdit').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}function cancelEditing(){editingId=null;$('form').reset();$('quantity').value=1;$('formTitle').textContent='Add a Part';$('publishBtn').textContent='Save Listing';$('cancelEdit').classList.add('hidden')}$('form').addEventListener('submit',async e=>{e.preventDefault();const st=$('shipping_type').value;if(st==='calculated'&&(!$('ship_from_postal_code').value||!+$('weight_lbs').value||!+$('length_in').value||!+$('width_in').value||!+$('height_in').value)){$('status').textContent='Calculated shipping requires ship-from ZIP plus packed weight, length, width and height.';return}const payload={name:$('name').value,category:$('category').value,price:+$('price').value,year:$('year').value,make:$('make').value,model:$('model').value,part_number:$('part_number').value,condition:$('condition').value,quantity:+$('quantity').value,description:$('description').value,shipping_type:st,ship_from_postal_code:$('ship_from_postal_code').value.trim()||null,weight_lbs:+$('weight_lbs').value||null,length_in:+$('length_in').value||null,width_in:+$('width_in').value||null,height_in:+$('height_in').value||null};$('status').textContent='Saving...';const r=editingId?await sb.from('products').update(payload).eq('id',editingId).select().single():await sb.from('products').insert({...payload,status:'draft'}).select().single();if(r.error){$('status').textContent=r.error.message;return}const p=r.data,files=[...$('photos').files];for(let i=0;i<files.length;i++){const f=files[i],path=p.id+'/'+Date.now()+'-'+i+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),up=await sb.storage.from('product-images').upload(path,f);if(up.error){$('status').textContent='Listing saved; photo failed: '+up.error.message;return}await sb.from('product_photos').insert({product_id:p.id,storage_path:path,sort_order:i})}$('status').textContent='Saved.';cancelEditing();load()});$('loginBtn').onclick=login;sb.auth.onAuthStateChange((_e,s)=>{if(s)setTimeout(check,0);else check()});check();</script></body></html>
