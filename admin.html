<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Road Iron Admin</title><link rel='manifest' href='manifest.webmanifest'><meta name='theme-color' content='#101112'><link rel='icon' href='icon.svg'><script src='https://unpkg.com/@supabase/supabase-js@2.57.4/dist/umd/supabase.js'></script><style>body{font-family:Arial;background:#101112;color:#eee;margin:0}.wrap{max-width:850px;margin:auto;padding:25px}input,select,textarea{width:100%;box-sizing:border-box;background:#1d2022;color:#eee;border:1px solid #444;border-radius:7px;padding:11px;margin:5px 0 12px}button{background:#e0a12b;border:0;padding:12px 16px;border-radius:7px;font-weight:bold;cursor:pointer}.card{background:#191b1d;border:1px solid #34383b;border-radius:12px;padding:20px;margin:15px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.items{display:grid;gap:10px}.item{background:#222528;padding:15px;border-radius:9px;display:flex;justify-content:space-between;gap:10px}.muted{color:#aaa}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class='wrap'><h1>ROAD IRON — Admin</h1><p class='muted'>Add and manage your inventory from your phone.</p><div id='login' class='card'><h2>Owner Login</h2><p>Enter your email. Supabase will send a secure sign-in link.</p><input id='email' type='email' placeholder='Your email address'><button id='loginBtn' type='button'>Send Login Link</button><p id='diag' style='color:#e0a12b;font-weight:bold'>Checking login system...</p><p id='msg' class='muted'></p></div><div id='app' class='hidden'><div class='card'><div style='display:flex;justify-content:space-between;align-items:center'><h2 id='formTitle'>Add a Part</h2><button onclick='logout()'>Log Out</button></div><form id='form'><label>Part name</label><input id='name' required><div class='row'><div><label>Category</label><select id='category'><option>NOS Parts</option><option>Used Parts</option><option>Vintage Clothing</option><option>Classic Cars</option></select></div><div><label>Price</label><input id='price' type='number' min='0' step='.01' required></div></div><div class='row'><div><label>Year</label><input id='year'></div><div><label>Make</label><input id='make'></div></div><div class='row'><div><label>Model</label><input id='model'></div><div><label>Part number</label><input id='part_number'></div></div><div class='row'><div><label>Condition</label><input id='condition'></div><div><label>Quantity</label><input id='quantity' type='number' min='0' value='1'></div></div><label>Description</label><textarea id='description' rows='5'></textarea><label>Photos</label><input id='photos' type='file' accept='image/*' multiple><button id='publishBtn' type='submit'>Publish Listing</button> <button id='cancelEdit' type='button' class='hidden' onclick='cancelEditing()'>Cancel Edit</button><p id='status' class='muted'></p></form></div><div class='card'><h2>Your Listings</h2><div id='list' class='items'></div></div><div class='card'><h2>Orders</h2><p class='muted'>Paid orders will appear here after Stripe checkout is connected.</p><div id='orders' class='items'></div></div></div></div><script>const SUPABASE_URL='https://sblnblmcvyvmllyvrnbb.supabase.co',KEY='sb_publishable_eV80ZW_U97yqGquu4bFL0A_i4S0hCia';let sb,editingId=null;try{if(!window.supabase)throw new Error('Supabase library blocked');sb=window.supabase.createClient(SUPABASE_URL,KEY);document.addEventListener('DOMContentLoaded',()=>{document.getElementById('diag').textContent='Login system ready.'});}catch(e){document.addEventListener('DOMContentLoaded',()=>{document.getElementById('diag').textContent='ERROR: '+e.message;});}window.addEventListener('error',e=>{const d=document.getElementById('diag');if(d)d.textContent='PAGE ERROR: '+(e.message||'unknown error')});const $=id=>document.getElementById(id);async function check(){const{data}=await sb.auth.getSession();if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}}async function login(){const email=$('email').value.trim();if(!email){$('msg').textContent='Enter your email address first.';return}const b=$('loginBtn');b.disabled=true;$('msg').textContent='Sending login email...';try{const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://bhint01.github.io/road-iron/admin.html'}});$('msg').textContent=error?'Login error: '+error.message:'Login email sent. Check your inbox and spam folder.'}catch(e){$('msg').textContent='Login error: '+(e.message||'Could not connect.')}finally{b.disabled=false}}async function logout(){await sb.auth.signOut();check()}async function load(){loadOrders();const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});window.inventory=data||[];$('list').innerHTML=error?'<p>'+esc(error.message)+'</p>':(data||[]).map(p=>`<div class='item'><div><b>${esc(p.name)}</b><br><span class='muted'>${esc(p.category)} • ${Number(p.price).toFixed(2)} • ${esc(p.status)}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button onclick="editItem('${p.id}')">Edit</button><button onclick="toggleSold('${p.id}','${p.status}')">${p.status==='sold'?'Mark Active':'Mark Sold'}</button><button onclick="remove('${p.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No listings yet.</p>'}async function loadOrders(){const{data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(50);const el=$('orders');if(!el)return;if(error){el.innerHTML='<p class="muted">'+esc(error.message)+'</p>';return}el.innerHTML=(data||[]).map(o=>`<div class='item'><div><b>Order #${o.order_number||''}</b><br><span class='muted'>${esc(o.customer_name||o.customer_email||'Customer')} • ${Number(o.total||0).toFixed(2)} • ${esc(o.status)}</span></div></div>`).join('')||'<p class="muted">No orders yet.</p>'}async function remove(id){if(!confirm('Delete this listing?'))return;const{error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);else load()} async function toggleSold(id,status){const{error}=await sb.from('products').update({status:status==='sold'?'active':'sold'}).eq('id',id);if(error)alert(error.message);else load()} function editItem(id){const p=(window.inventory||[]).find(x=>x.id===id);if(!p)return;editingId=id;['name','category','price','year','make','model','part_number','condition','quantity','description'].forEach(k=>{if($(k))$(k).value=p[k]??''});$('formTitle').textContent='Edit Listing';$('publishBtn').textContent='Save Changes';$('cancelEdit').classList.remove('hidden');$('status').textContent='Editing '+p.name+'. Existing photos will stay unless you add more.';window.scrollTo({top:0,behavior:'smooth'})} function cancelEditing(){editingId=null;$('form').reset();$('quantity').value='1';$('formTitle').textContent='Add a Part';$('publishBtn').textContent='Publish Listing';$('cancelEdit').classList.add('hidden');$('status').textContent=''}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('form').addEventListener('submit',async e=>{e.preventDefault();const publishBtn=e.submitter||e.target.querySelector("button[type='submit']");if(publishBtn)publishBtn.disabled=true;$('status').textContent='Saving listing...';try{const payload={name:$('name').value,category:$('category').value,price:Number($('price').value),year:$('year').value,make:$('make').value,model:$('model').value,part_number:$('part_number').value,condition:$('condition').value,quantity:Number($('quantity').value),description:$('description').value};const result=editingId?await sb.from('products').update(payload).eq('id',editingId).select().single():await sb.from('products').insert({...payload,status:'active'}).select().single();const{data:p,error}=result;if(error){$('status').textContent=error.message;return}const files=[...$('photos').files];for(let i=0;i<files.length;i++){const f=files[i],path=p.id+'/'+Date.now()+'-'+i+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');$('status').textContent='Uploading photo '+(i+1)+' of '+files.length+'...';const up=await sb.storage.from('product-images').upload(path,f,{upsert:false});if(up.error){$('status').textContent='Listing saved, but photo failed: '+up.error.message;await load();return}const photoSave=await sb.from('product_photos').insert({product_id:p.id,storage_path:path,sort_order:i});if(photoSave.error){$('status').textContent='Listing saved, but photo record failed: '+photoSave.error.message;await load();return}}$('status').textContent=editingId?'Changes saved successfully.':'Published successfully.';editingId=null;$('form').reset();$('quantity').value='1';$('formTitle').textContent='Add a Part';$('publishBtn').textContent='Publish Listing';$('cancelEdit').classList.add('hidden');await load()}catch(err){$('status').textContent='Save error: '+(err.message||String(err))}finally{if(publishBtn)publishBtn.disabled=false}});$('loginBtn').addEventListener('click',login);sb.auth.onAuthStateChange((_event,session)=>{if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');setTimeout(()=>load(),0)}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});check();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
