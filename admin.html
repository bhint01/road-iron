<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Road Iron Admin</title><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js'></script><style>body{font-family:Arial;background:#101112;color:#eee;margin:0}.wrap{max-width:850px;margin:auto;padding:25px}input,select,textarea{width:100%;box-sizing:border-box;background:#1d2022;color:#eee;border:1px solid #444;border-radius:7px;padding:11px;margin:5px 0 12px}button{background:#e0a12b;border:0;padding:12px 16px;border-radius:7px;font-weight:bold;cursor:pointer}.card{background:#191b1d;border:1px solid #34383b;border-radius:12px;padding:20px;margin:15px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.items{display:grid;gap:10px}.item{background:#222528;padding:15px;border-radius:9px;display:flex;justify-content:space-between;gap:10px}.muted{color:#aaa}.hidden{display:none}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class='wrap'><h1>ROAD IRON — Admin</h1><p class='muted'>Add and manage your inventory from your phone.</p><div id='login' class='card'><h2>Owner Login</h2><p>Enter your email. Supabase will send a secure sign-in link.</p><input id='email' type='email' placeholder='Your email address'><button id='loginBtn' type='button'>Send Login Link</button><p id='diag' style='color:#e0a12b;font-weight:bold'>Checking login system...</p><p id='msg' class='muted'></p></div><div id='app' class='hidden'><div class='card'><div style='display:flex;justify-content:space-between;align-items:center'><h2>Add a Part</h2><button onclick='logout()'>Log Out</button></div><form id='form'><label>Part name</label><input id='name' required><div class='row'><div><label>Category</label><select id='category'><option>NOS Parts</option><option>Used Parts</option><option>Vintage Clothing</option><option>Classic Cars</option></select></div><div><label>Price</label><input id='price' type='number' min='0' step='.01' required></div></div><div class='row'><div><label>Year</label><input id='year'></div><div><label>Make</label><input id='make'></div></div><div class='row'><div><label>Model</label><input id='model'></div><div><label>Part number</label><input id='part_number'></div></div><div class='row'><div><label>Condition</label><input id='condition'></div><div><label>Quantity</label><input id='quantity' type='number' min='0' value='1'></div></div><label>Description</label><textarea id='description' rows='5'></textarea><label>Photos</label><input id='photos' type='file' accept='image/*' multiple><button type='submit'>Publish Listing</button><p id='status' class='muted'></p></form></div><div class='card'><h2>Your Listings</h2><div id='list' class='items'></div></div></div></div><script>const URL='https://sblnblmcvyvmllyvrnbb.supabase.co',KEY='sb_publishable_eV80ZW_U97yqGquu4bFL0A_i4S0hCia';const sb=supabase.createClient(URL,KEY);window.addEventListener('load',()=>{const d=document.getElementById('diag');if(window.supabase&&sb){d.textContent='Login system ready.'}else{d.textContent='ERROR: Login system did not load.'}});window.addEventListener('error',e=>{const d=document.getElementById('diag');if(d)d.textContent='PAGE ERROR: '+(e.message||'unknown error')});const $=id=>document.getElementById(id);async function check(){const{data}=await sb.auth.getSession();if(data.session){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}}async function login(){const email=$('email').value.trim();if(!email){$('msg').textContent='Enter your email address first.';return}const b=$('loginBtn');b.disabled=true;$('msg').textContent='Sending login email...';try{const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://bhint01.github.io/road-iron/admin.html'}});$('msg').textContent=error?'Login error: '+error.message:'Login email sent. Check your inbox and spam folder.'}catch(e){$('msg').textContent='Login error: '+(e.message||'Could not connect.')}finally{b.disabled=false}}async function logout(){await sb.auth.signOut();check()}async function load(){const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});$('list').innerHTML=error?'<p>'+error.message+'</p>':data.map(p=>`<div class='item'><div><b>${esc(p.name)}</b><br><span class='muted'>${esc(p.category)} • $${Number(p.price).toFixed(2)} • ${p.status}</span></div><button onclick="remove('${p.id}')">Delete</button></div>`).join('')||'<p class="muted">No listings yet.</p>'}async function remove(id){if(!confirm('Delete this listing?'))return;await sb.from('products').delete().eq('id',id);load()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}$('form').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='Saving...';const{data:p,error}=await sb.from('products').insert({name:$('name').value,category:$('category').value,price:Number($('price').value),year:$('year').value,make:$('make').value,model:$('model').value,part_number:$('part_number').value,condition:$('condition').value,quantity:Number($('quantity').value),description:$('description').value,status:'active'}).select().single();if(error){$('status').textContent=error.message;return}const files=[...$('photos').files];for(let i=0;i<files.length;i++){const f=files[i],path=p.id+'/'+Date.now()+'-'+i+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from('product-images').upload(path,f,{upsert:false});if(!up.error)await sb.from('product_photos').insert({product_id:p.id,storage_path:path,sort_order:i})}$('status').textContent='Published.';$('form').reset();load()});$('loginBtn').addEventListener('click',login);sb.auth.onAuthStateChange(()=>check());check();</script></body></html>
