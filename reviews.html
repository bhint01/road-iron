<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROAD IRON Reviews</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#101112;color:#eee;font:17px Arial;margin:0;padding:24px}main{max-width:650px;margin:auto}a{color:#e3a32b}label{display:block;margin:16px 0 5px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:14px;border-radius:8px;border:1px solid #555;background:#222;color:white;font:inherit}button{background:#e2a12d;color:#171717;font-weight:bold;margin-top:18px;cursor:pointer}textarea{min-height:130px}p{line-height:1.5}.muted{color:#aaa}section{border:1px solid #444;border-radius:12px;padding:20px;margin:20px 0}</style></head><body><main><p><a href="/">← ROAD IRON</a></p><h1>Buyer & Seller Reviews</h1><p>Only participants in completed, paid orders can submit reviews. Reviews require administrator approval before publication.</p><section id="login"><label>Email address</label><input type="email" id="email" autocomplete="email"><button id="signIn">Email me a sign-in link</button><p class="muted">Use the same email address used for your order or seller account.</p></section><section id="review" hidden><p id="identity"></p><label>Order ID</label><input id="order" placeholder="Order UUID from your order confirmation"><button id="verify">Verify completed transaction</button><div id="fields" hidden><label>Reviewing</label><select id="subject"></select><label>Rating</label><select id="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><label>Review (10–2000 characters)</label><textarea id="comment" maxlength="2000"></textarea><button id="submit">Submit for approval</button></div><button id="signOut">Sign out</button></section><section><h2>Approved reviews</h2><div id="publicReviews">Loading...</div></section><p id="message" role="status"></p></main><script>const sb=supabase.createClient('https://sblnblmcvyvmllyvrnbb.supabase.co','sb_publishable_eV80ZW_U97yqGquu4bFL0A_i4S0hCia');const $=id=>document.getElementById(id);let eligible=null;const msg=t=>$('message').textContent=t;async function refresh(){const{data}=await sb.auth.getUser();$('login').hidden=!!data.user;$('review').hidden=!data.user;if(data.user)$('identity').textContent='Signed in: '+data.user.email}async function invoke(body){const{data,error}=await sb.functions.invoke('marketplace-submit-review',{body});if(error)throw Error(data?.error||error.message);if(data?.error)throw Error(data.error);return data}$('signIn').onclick=async()=>{const email=$('email').value.trim();if(!email)return msg('Enter your email.');const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://road-iron.com/reviews.html'}});msg(error?.message||'Check your email for the sign-in link.')};$('verify').onclick=async()=>{try{eligible=await invoke({action:'eligible',order_id:$('order').value.trim()});$('subject').replaceChildren();if(eligible.role==='buyer'){for(const id of eligible.sellers){const o=document.createElement('option');o.value=id;o.textContent='Seller on this order';$('subject').append(o)}}else{const o=document.createElement('option');o.value='buyer';o.textContent='Buyer on this order';$('subject').append(o)}$('fields').hidden=false;msg('Order verified. You can now write your review.')}catch(e){eligible=null;$('fields').hidden=true;msg(e.message)}};$('submit').onclick=async()=>{if(!eligible)return;try{const result=await invoke({action:'submit',order_id:$('order').value.trim(),subject_id:eligible.role==='buyer'?$('subject').value:undefined,rating:Number($('rating').value),comment:$('comment').value});msg('Review submitted. Status: '+result.status+'. It will appear after administrator approval.');$('fields').hidden=true;$('comment').value=''}catch(e){msg(e.message)}};$('signOut').onclick=async()=>{await sb.auth.signOut();refresh()};async function loadPublicReviews(){const{data,error}=await sb.from('marketplace_reviews').select('reviewer_role,rating,comment,created_at').eq('status','published').order('created_at',{ascending:false}).limit(30);const target=$('publicReviews');target.replaceChildren();if(error){target.textContent='Reviews unavailable.';return}if(!data?.length){target.textContent='No approved reviews yet.';return}for(const review of data){const p=document.createElement('p');p.textContent=(review.reviewer_role==='buyer'?'Seller review':'Buyer review')+' • '+review.rating+'/5 stars — '+review.comment;target.append(p)}}sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();loadPublicReviews();</script></body></html>
