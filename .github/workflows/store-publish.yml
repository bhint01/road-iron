name: Seller publishing release checks
on:
  push:
    branches: [store-publishing-check]
    paths: [store-publish/release/**, .github/workflows/store-publish.yml]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Publication and isolation tests
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d test -v ON_ERROR_STOP=1 -f store-publish/release/bootstrap.sql
          psql -h localhost -U postgres -d test -v ON_ERROR_STOP=1 -f store-publish/release/draft-schema.sql
          psql -h localhost -U postgres -d test -v ON_ERROR_STOP=1 -f store-publish/release/schema.sql
          psql -h localhost -U postgres -d test -v ON_ERROR_STOP=1 -f store-publish/release/database-test.sql
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - run: google-chrome --version
      - run: python store-publish/release/browser.py
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node store-publish/release/webhook-key-test.mjs
