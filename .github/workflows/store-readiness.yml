name: Storefront live readiness
on:
  push:
    branches: [store-publishing-check]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only deployed readiness
        run: |
          python - <<'PY'
          import json,urllib.request
          u='https://sblnblmcvyvmllyvrnbb.supabase.co/functions/v1/marketplace-create-checkout/health'
          with urllib.request.urlopen(u,timeout=50) as r:
              data=json.load(r)
          print(json.dumps(data,sort_keys=True))
          assert data['ready'],data['blockers']
          PY
